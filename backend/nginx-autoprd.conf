# AutoPRD.id — nginx vhost
# Deploy: copy ke /etc/nginx/sites-available/autoprd, symlink ke sites-enabled, nginx -t && systemctl reload nginx
# HTTPS: sudo certbot --nginx -d prd.alfaruqasri.my.id (setelah DNS A record mengarah ke VPS ini)

server {
    listen 80;
    server_name prd.alfaruqasri.my.id;

    # NDJSON streaming: matikan buffering proxy agar section PRD mengalir real-time
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
